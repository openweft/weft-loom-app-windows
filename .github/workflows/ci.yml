name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: gofmt + build (Windows, cgo/WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout weft-app-core
        uses: actions/checkout@v4
        with:
          repository: openweft/weft-app-core
          path: ../weft-app-core

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go test
        shell: cmd
        run: |
          set CGO_ENABLED=1
          go test ./... -count=1

      - name: Build
        shell: cmd
        run: |
          set CGO_ENABLED=1
          go build -ldflags "-H windowsgui" -o weft-loom-app-windows.exe .
